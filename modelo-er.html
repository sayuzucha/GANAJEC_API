<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>GANAJEC AI – Modelo Entidad-Relación</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; }

  header {
    background: linear-gradient(135deg, #1e3a5f 0%, #0f4c75 100%);
    padding: 24px 40px;
    border-bottom: 2px solid #2dd4bf;
    display: flex; align-items: center; gap: 16px;
  }
  header h1 { font-size: 1.6rem; color: #fff; }
  header .badge {
    background: #2dd4bf; color: #0f172a;
    font-size: 0.7rem; font-weight: 700; padding: 3px 10px;
    border-radius: 999px; text-transform: uppercase; letter-spacing: 1px;
  }

  .legend {
    display: flex; gap: 20px; padding: 14px 40px;
    background: #1e293b; border-bottom: 1px solid #334155;
    flex-wrap: wrap; font-size: 0.78rem;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot-pk { background: #f59e0b; }
  .dot-fk { background: #60a5fa; }
  .dot-attr { background: #94a3b8; }

  .canvas-wrap {
    overflow: auto; padding: 30px 40px 60px;
  }

  svg text { font-family: 'Segoe UI', monospace; }

  /* Tooltip */
  .tooltip {
    position: fixed; background: #1e293b; border: 1px solid #475569;
    border-radius: 8px; padding: 10px 14px; font-size: 0.78rem;
    pointer-events: none; opacity: 0; transition: opacity .15s;
    max-width: 260px; z-index: 999; color: #cbd5e1; line-height: 1.6;
  }
  .tooltip.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>🐄 GANAJEC AI — Modelo Entidad-Relación</h1>
  <span class="badge">v2.0.0</span>
</header>

<div class="legend">
  <div class="legend-item"><div class="dot dot-pk"></div> PK — Llave primaria (UUID)</div>
  <div class="legend-item"><div class="dot dot-fk"></div> FK — Llave foránea</div>
  <div class="legend-item"><div class="dot dot-attr"></div> Atributo</div>
  <div class="legend-item">🔗 — Relación 1:N</div>
  <div class="legend-item">🔀 — Relación N:M</div>
</div>

<div class="canvas-wrap">
<svg id="er" width="1400" height="1100" viewBox="0 0 1400 1100">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-nm" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <!-- ════════════════════════════════════════════════
       RELACIONES (trazadas primero para quedar detrás)
       ════════════════════════════════════════════════ -->

  <!-- Usuario ─1:N─► Rancho (dueno_id) -->
  <line x1="340" y1="200" x2="440" y2="200" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="380" y="192" font-size="10" fill="#94a3b8" text-anchor="middle">1:N</text>

  <!-- RanchoGanadero N:M (Usuario ↔ Rancho) -->
  <line x1="260" y1="280" x2="260" y2="530" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-nm)"/>
  <line x1="530" y1="280" x2="530" y2="490" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-nm)"/>
  <text x="230" y="420" font-size="10" fill="#a78bfa" text-anchor="middle">N:M</text>

  <!-- Rancho ─1:N─► Bovino -->
  <line x1="650" y1="230" x2="730" y2="230" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="690" y="222" font-size="10" fill="#94a3b8" text-anchor="middle">1:N</text>

  <!-- Usuario ─1:N─► Bovino (ganadero_id) -->
  <line x1="340" y1="230" x2="730" y2="340" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Bovino ─1:N─► HistorialProductivo -->
  <line x1="900" y1="290" x2="1020" y2="290" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="960" y="282" font-size="10" fill="#94a3b8" text-anchor="middle">1:N</text>

  <!-- Bovino ─1:N─► RegistroSintoma -->
  <line x1="850" y1="410" x2="730" y2="550" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="808" y="470" font-size="10" fill="#94a3b8" text-anchor="middle">1:N</text>

  <!-- RegistroSintoma ─1:1─► Prediccion -->
  <line x1="900" y1="620" x2="1020" y2="620" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="960" y="612" font-size="10" fill="#94a3b8" text-anchor="middle">1:1</text>

  <!-- Bovino ─1:N─► Alerta -->
  <line x1="850" y1="360" x2="350" y2="570" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Usuario ─1:N─► Alerta (ganadero_id) -->
  <line x1="260" y1="280" x2="260" y2="560" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Alerta ─1:N─► Notificacion -->
  <line x1="350" y1="650" x2="490" y2="760" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="720" font-size="10" fill="#94a3b8" text-anchor="middle">1:N</text>

  <!-- Usuario ─1:N─► Notificacion -->
  <line x1="340" y1="250" x2="540" y2="760" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

  <!-- Plan ─1:N─► Suscripcion -->
  <line x1="1150" y1="530" x2="1000" y2="760" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1090" y="650" font-size="10" fill="#94a3b8" text-anchor="middle">1:N</text>

  <!-- Usuario ─1:N─► Suscripcion -->
  <line x1="340" y1="260" x2="920" y2="780" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

  <!-- Usuario ─1:N─► AuditoriaLog -->
  <line x1="340" y1="220" x2="1020" y2="940" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

  <!-- ════════════════════════════════════════════════
       ENTIDADES
       ════════════════════════════════════════════════ -->

  <!-- ── USUARIO ──────────────────────────────────── -->
  <g class="entity" data-info="Tabla: usuarios | Roles: ganadero, dueno, admin | UUID como PK">
    <rect x="100" y="120" width="240" height="200" rx="8" fill="#1e3a5f" stroke="#2dd4bf" stroke-width="2"/>
    <rect x="100" y="120" width="240" height="34" rx="8" fill="#2dd4bf"/>
    <text x="220" y="143" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">USUARIO</text>
    <!-- campos -->
    <text x="115" y="170" font-size="11" fill="#f59e0b">🔑 id: UUID (PK)</text>
    <text x="115" y="188" font-size="11" fill="#e2e8f0">nombre: VARCHAR(150)</text>
    <text x="115" y="206" font-size="11" fill="#e2e8f0">email: VARCHAR(150) UNIQUE</text>
    <text x="115" y="224" font-size="11" fill="#e2e8f0">password_hash: VARCHAR(255)</text>
    <text x="115" y="242" font-size="11" fill="#e2e8f0">rol: ENUM(ganadero|dueno|admin)</text>
    <text x="115" y="260" font-size="11" fill="#e2e8f0">activo: BOOLEAN</text>
    <text x="115" y="278" font-size="11" fill="#e2e8f0">fcm_token: VARCHAR(255)</text>
    <text x="115" y="296" font-size="11" fill="#94a3b8">creado_en: DATETIME</text>
  </g>

  <!-- ── RANCHO ──────────────────────────────────── -->
  <g class="entity" data-info="Tabla: ranchos | codigo_invitacion para que ganaderos se unan">
    <rect x="440" y="120" width="210" height="190" rx="8" fill="#1e3a5f" stroke="#2dd4bf" stroke-width="2"/>
    <rect x="440" y="120" width="210" height="34" rx="8" fill="#2dd4bf"/>
    <text x="545" y="143" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">RANCHO</text>
    <text x="455" y="170" font-size="11" fill="#f59e0b">🔑 id: UUID (PK)</text>
    <text x="455" y="188" font-size="11" fill="#60a5fa">🔗 dueno_id: FK→usuarios</text>
    <text x="455" y="206" font-size="11" fill="#e2e8f0">nombre: VARCHAR(150)</text>
    <text x="455" y="224" font-size="11" fill="#e2e8f0">municipio: VARCHAR(100)</text>
    <text x="455" y="242" font-size="11" fill="#e2e8f0">estado: VARCHAR(100)</text>
    <text x="455" y="260" font-size="11" fill="#e2e8f0">codigo_invitacion: VARCHAR(8)</text>
    <text x="455" y="278" font-size="11" fill="#94a3b8">creado_en: DATETIME</text>
  </g>

  <!-- ── RANCHO_GANADEROS (N:M) ─────────────────── -->
  <g class="entity" data-info="Tabla intermedia N:M: un ganadero puede estar en varios ranchos y viceversa">
    <rect x="140" y="490" width="220" height="110" rx="8" fill="#2d1b69" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="140" y="490" width="220" height="34" rx="8" fill="#8b5cf6"/>
    <text x="250" y="513" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">RANCHO_GANADEROS</text>
    <text x="155" y="540" font-size="11" fill="#60a5fa">🔗 rancho_id: FK→ranchos (PK)</text>
    <text x="155" y="558" font-size="11" fill="#60a5fa">🔗 ganadero_id: FK→usuarios (PK)</text>
    <text x="155" y="576" font-size="11" fill="#94a3b8">asignado_en: DATETIME</text>
  </g>

  <!-- ── BOVINO ──────────────────────────────────── -->
  <g class="entity" data-info="Tabla: bovinos | categorias: vaca, toro, becerro… | propósitos: leche, carne, doble, cria">
    <rect x="730" y="190" width="230" height="250" rx="8" fill="#1e3a5f" stroke="#2dd4bf" stroke-width="2"/>
    <rect x="730" y="190" width="230" height="34" rx="8" fill="#2dd4bf"/>
    <text x="845" y="213" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">BOVINO</text>
    <text x="745" y="240" font-size="11" fill="#f59e0b">🔑 id: UUID (PK)</text>
    <text x="745" y="258" font-size="11" fill="#60a5fa">🔗 rancho_id: FK→ranchos</text>
    <text x="745" y="276" font-size="11" fill="#60a5fa">🔗 ganadero_id: FK→usuarios</text>
    <text x="745" y="294" font-size="11" fill="#e2e8f0">nombre: VARCHAR(100)</text>
    <text x="745" y="312" font-size="11" fill="#e2e8f0">raza: VARCHAR(100)</text>
    <text x="745" y="330" font-size="11" fill="#e2e8f0">sexo: ENUM(hembra|macho)</text>
    <text x="745" y="348" font-size="11" fill="#e2e8f0">categoria: ENUM(7 valores)</text>
    <text x="745" y="366" font-size="11" fill="#e2e8f0">proposito: ENUM(4 valores)</text>
    <text x="745" y="384" font-size="11" fill="#e2e8f0">peso_kg: FLOAT</text>
    <text x="745" y="402" font-size="11" fill="#e2e8f0">id_externo: VARCHAR(50)</text>
    <text x="745" y="420" font-size="11" fill="#94a3b8">fecha_nacimiento / creado_en</text>
  </g>

  <!-- ── HISTORIAL PRODUCTIVO ────────────────────── -->
  <g class="entity" data-info="Tabla: historial_productivo | detecta anomalías con ML">
    <rect x="1020" y="200" width="230" height="190" rx="8" fill="#1e3a5f" stroke="#2dd4bf" stroke-width="2"/>
    <rect x="1020" y="200" width="230" height="34" rx="8" fill="#2dd4bf"/>
    <text x="1135" y="223" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">HISTORIAL_PRODUCTIVO</text>
    <text x="1035" y="250" font-size="11" fill="#f59e0b">🔑 id: UUID (PK)</text>
    <text x="1035" y="268" font-size="11" fill="#60a5fa">🔗 bovino_id: FK→bovinos</text>
    <text x="1035" y="286" font-size="11" fill="#e2e8f0">fecha: DATE</text>
    <text x="1035" y="304" font-size="11" fill="#e2e8f0">litros_leche: FLOAT</text>
    <text x="1035" y="322" font-size="11" fill="#e2e8f0">kg_alimento: FLOAT</text>
    <text x="1035" y="340" font-size="11" fill="#e2e8f0">ganancia_peso_kg: FLOAT</text>
    <text x="1035" y="358" font-size="11" fill="#e2e8f0">temperatura: FLOAT</text>
    <text x="1035" y="376" font-size="11" fill="#e2e8f0">anomalia_detectada: BOOLEAN</text>
  </g>

  <!-- ── REGISTRO SINTOMA ────────────────────────── -->
  <g class="entity" data-info="Tabla: registros_sintomas | NLP extrae síntomas del texto_libre para predicción ML">
    <rect x="490" y="530" width="240" height="230" rx="8" fill="#1e3a5f" stroke="#2dd4bf" stroke-width="2"/>
    <rect x="490" y="530" width="240" height="34" rx="8" fill="#2dd4bf"/>
    <text x="610" y="553" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">REGISTRO_SINTOMA</text>
    <text x="505" y="580" font-size="11" fill="#f59e0b">🔑 id: UUID (PK)</text>
    <text x="505" y="598" font-size="11" fill="#60a5fa">🔗 bovino_id: FK→bovinos</text>
    <text x="505" y="616" font-size="11" fill="#60a5fa">🔗 ganadero_id: FK→usuarios</text>
    <text x="505" y="634" font-size="11" fill="#e2e8f0">texto_libre: TEXT</text>
    <text x="505" y="652" font-size="11" fill="#e2e8f0">temperatura / prod_leche: FLOAT</text>
    <text x="505" y="670" font-size="11" fill="#e2e8f0">frec_cardiaca / respiratoria: FLOAT</text>
    <text x="505" y="688" font-size="11" fill="#e2e8f0">condicion_corporal: FLOAT (1-5)</text>
    <text x="505" y="706" font-size="11" fill="#e2e8f0">consumo_alimento / agua: FLOAT</text>
    <text x="505" y="724" font-size="11" fill="#e2e8f0">sintomas_seleccionados: JSON</text>
    <text x="505" y="742" font-size="11" fill="#94a3b8">registrado_en: DATETIME</text>
  </g>

  <!-- ── PREDICCION ──────────────────────────────── -->
  <g class="entity" data-info="Tabla: predicciones | Generada por ML (Random Forest) a partir del registro de síntomas">
    <rect x="1020" y="560" width="220" height="160" rx="8" fill="#1e3a5f" stroke="#2dd4bf" stroke-width="2"/>
    <rect x="1020" y="560" width="220" height="34" rx="8" fill="#2dd4bf"/>
    <text x="1130" y="583" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">PREDICCION</text>
    <text x="1035" y="610" font-size="11" fill="#f59e0b">🔑 id: UUID (PK)</text>
    <text x="1035" y="628" font-size="11" fill="#60a5fa">🔗 registro_id: FK→reg_sintomas</text>
    <text x="1035" y="646" font-size="11" fill="#e2e8f0">enfermedad: VARCHAR(150)</text>
    <text x="1035" y="664" font-size="11" fill="#e2e8f0">confianza: FLOAT</text>
    <text x="1035" y="682" font-size="11" fill="#e2e8f0">severidad: ENUM(leve|mod|alta)</text>
    <text x="1035" y="700" font-size="11" fill="#e2e8f0">features_nlp: JSON</text>
  </g>

  <!-- ── ALERTA ──────────────────────────────────── -->
  <g class="entity" data-info="Tabla: alertas | tipo: productiva o clínica | severidad: baja, media, alta">
    <rect x="100" y="560" width="230" height="180" rx="8" fill="#1e3a5f" stroke="#f97316" stroke-width="2"/>
    <rect x="100" y="560" width="230" height="34" rx="8" fill="#f97316"/>
    <text x="215" y="583" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">ALERTA</text>
    <text x="115" y="610" font-size="11" fill="#f59e0b">🔑 id: UUID (PK)</text>
    <text x="115" y="628" font-size="11" fill="#60a5fa">🔗 bovino_id: FK→bovinos</text>
    <text x="115" y="646" font-size="11" fill="#60a5fa">🔗 ganadero_id: FK→usuarios</text>
    <text x="115" y="664" font-size="11" fill="#e2e8f0">tipo: ENUM(productiva|clinica)</text>
    <text x="115" y="682" font-size="11" fill="#e2e8f0">severidad: ENUM(baja|media|alta)</text>
    <text x="115" y="700" font-size="11" fill="#e2e8f0">mensaje: TEXT</text>
    <text x="115" y="718" font-size="11" fill="#e2e8f0">leida: BOOLEAN</text>
    <text x="115" y="736" font-size="11" fill="#94a3b8">creado_en: DATETIME</text>
  </g>

  <!-- ── NOTIFICACION ────────────────────────────── -->
  <g class="entity" data-info="Tabla: notificaciones | envío FCM Push via Firebase">
    <rect x="490" y="760" width="220" height="130" rx="8" fill="#1e3a5f" stroke="#2dd4bf" stroke-width="2"/>
    <rect x="490" y="760" width="220" height="34" rx="8" fill="#2dd4bf"/>
    <text x="600" y="783" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">NOTIFICACION</text>
    <text x="505" y="810" font-size="11" fill="#f59e0b">🔑 id: UUID (PK)</text>
    <text x="505" y="828" font-size="11" fill="#60a5fa">🔗 usuario_id: FK→usuarios</text>
    <text x="505" y="846" font-size="11" fill="#60a5fa">🔗 alerta_id: FK→alertas</text>
    <text x="505" y="864" font-size="11" fill="#e2e8f0">enviada: BOOLEAN</text>
    <text x="505" y="882" font-size="11" fill="#94a3b8">enviado_en: DATETIME</text>
  </g>

  <!-- ── PLAN ──────────────────────────────────────── -->
  <g class="entity" data-info="Tabla: planes | Define límite de bovinos y permisos por plan de suscripción">
    <rect x="1150" y="400" width="210" height="170" rx="8" fill="#1e3a5f" stroke="#2dd4bf" stroke-width="2"/>
    <rect x="1150" y="400" width="210" height="34" rx="8" fill="#2dd4bf"/>
    <text x="1255" y="423" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">PLAN</text>
    <text x="1165" y="450" font-size="11" fill="#f59e0b">🔑 id: UUID (PK)</text>
    <text x="1165" y="468" font-size="11" fill="#e2e8f0">nombre: VARCHAR(100)</text>
    <text x="1165" y="486" font-size="11" fill="#e2e8f0">precio_mensual: FLOAT</text>
    <text x="1165" y="504" font-size="11" fill="#e2e8f0">limite_bovinos: INTEGER</text>
    <text x="1165" y="522" font-size="11" fill="#e2e8f0">permisos: JSON</text>
    <text x="1165" y="540" font-size="11" fill="#e2e8f0">activo: BOOLEAN</text>
    <text x="1165" y="558" font-size="11" fill="#94a3b8">actualizado_en: DATETIME</text>
  </g>

  <!-- ── SUSCRIPCION ────────────────────────────────── -->
  <g class="entity" data-info="Tabla: suscripciones | Asocia un usuario (dueño) con un plan activo">
    <rect x="860" y="760" width="220" height="140" rx="8" fill="#1e3a5f" stroke="#2dd4bf" stroke-width="2"/>
    <rect x="860" y="760" width="220" height="34" rx="8" fill="#2dd4bf"/>
    <text x="970" y="783" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">SUSCRIPCION</text>
    <text x="875" y="810" font-size="11" fill="#f59e0b">🔑 id: UUID (PK)</text>
    <text x="875" y="828" font-size="11" fill="#60a5fa">🔗 usuario_id: FK→usuarios</text>
    <text x="875" y="846" font-size="11" fill="#60a5fa">🔗 plan_id: FK→planes</text>
    <text x="875" y="864" font-size="11" fill="#e2e8f0">inicio / fin: DATE</text>
    <text x="875" y="882" font-size="11" fill="#e2e8f0">activa: BOOLEAN</text>
  </g>

  <!-- ── AUDITORIA LOG ──────────────────────────────── -->
  <g class="entity" data-info="Tabla: auditoria_logs | registra acciones de admins en el sistema">
    <rect x="1020" y="900" width="230" height="160" rx="8" fill="#1e3a5f" stroke="#94a3b8" stroke-width="2"/>
    <rect x="1020" y="900" width="230" height="34" rx="8" fill="#475569"/>
    <text x="1135" y="923" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">AUDITORIA_LOG</text>
    <text x="1035" y="950" font-size="11" fill="#f59e0b">🔑 id: UUID (PK)</text>
    <text x="1035" y="968" font-size="11" fill="#60a5fa">🔗 usuario_id: FK→usuarios</text>
    <text x="1035" y="986" font-size="11" fill="#e2e8f0">accion: VARCHAR(150)</text>

<div class="tooltip" id="tooltip"></div>

<script>
  const tooltip = document.getElementById('tooltip');
  document.querySelectorAll('.entity').forEach(el => {
    el.style.cursor = 'pointer';
    el.addEventListener('mousemove', e => {
      tooltip.textContent = el.dataset.info;
      tooltip.classList.add('show');
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top  = (e.clientY + 14) + 'px';
    });
    el.addEventListener('mouseleave', () => tooltip.classList.remove('show'));
  });
</script>
